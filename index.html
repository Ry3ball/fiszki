<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiszki i Quiz Słówkowy - Ciemny Motyw</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --input-bg: #0f172a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }

        @media (min-width: 600px) {
            .container {
                padding: 30px;
            }
        }

        h1, h2 {
            color: var(--primary);
            margin-top: 0;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
        }

        textarea {
            height: 100px;
            font-family: monospace;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        /* Lista akordeonowa */
        .lists-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .list-accordion {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .list-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            user-select: none;
        }

        .list-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .list-content {
            padding: 0 15px 15px 15px;
            border-top: 1px solid var(--border);
            display: none;
            background: rgba(0, 0, 0, 0.1);
        }

        .list-content.open {
            display: block;
        }

        .word-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }

        .word-row:last-child {
            border-bottom: none;
        }

        .btn-danger {
            background-color: var(--error) !important;
            padding: 5px 10px;
            font-size: 12px;
            margin-top: 0;
        }

        .btn-danger:hover {
            background-color: #dc2626 !important;
        }

        /* Sekcja Nauki / Quizu */
        .quiz-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-top: 15px;
        }

        .word-display {
            font-size: clamp(22px, 6vw, 32px);
            font-weight: bold;
            margin: 15px 0;
            color: var(--text);
            word-break: break-word;
        }

        .hint-display {
            font-family: monospace;
            font-size: clamp(16px, 4.5vw, 24px);
            letter-spacing: 2px;
            color: var(--warning);
            margin: 15px 0;
            min-height: 36px;
            word-break: break-all;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .option-btn {
            background: var(--input-bg);
            color: var(--text);
            border: 2px solid var(--border);
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(12px, 3.5vw, 16px);
            line-height: 1.25;
            transition: all 0.2s;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            word-break: break-word;
            hyphens: auto;
            text-align: center;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .option-btn.correct {
            background: var(--success) !important;
            color: white;
            border-color: var(--success);
        }

        .option-btn.incorrect {
            background: var(--error) !important;
            color: white;
            border-color: var(--error);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .feedback-message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            min-height: 25px;
        }

        .feedback-correct {
            color: var(--success);
        }

        .feedback-incorrect {
            color: var(--error);
        }

        .hidden {
            display: none !important;
        }

        .actions-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .info-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="main-title">Fiszki i Quiz Słówkowy 🌙</h1>

    <!-- SEKCJA ZARZĄDZANIA -->
    <div id="management-container">
        <!-- KROK 1: Szybkie dodawanie + JSON -->
        <div class="section" id="import-section">
            <h2>1. Zarządzanie słówkami</h2>
            
            <div style="margin-bottom: 15px;">
                <p class="info-text" style="margin-bottom: 5px; font-weight: bold; color: var(--text);">Dodaj pojedyncze słówko:</p>
                <div class="form-row">
                    <input type="text" id="new-word-pl" placeholder="PL (np. pies)">
                    <input type="text" id="new-word-de" placeholder="DE (np. der Hund)">
                    <input type="text" id="new-word-list" placeholder="Nazwa listy (np. Zwierzęta)">
                </div>
                <button onclick="addSingleWord()" style="background-color: #059669;">Dodaj słówko</button>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <p class="info-text" style="margin-bottom: 5px; font-weight: bold; color: var(--text);">Lub wklej cały JSON:</p>
            <textarea id="json-input" placeholder='[
  {
    "list": "Zwierzęta",
    "words": [
      {"pl": "ser", "de": "der Käse"},
      {"pl": "kot", "de": "die Katze"}
    ]
  }
]'></textarea>
            <div class="actions-row">
                <button onclick="loadLists()">Odśwież / Załaduj z JSON</button>
                <button onclick="loadSampleData()" style="background-color: #475569;">Wklej przykład</button>
            </div>
        </div>

        <!-- KROK 2: Wybór list i trybu nauki -->
        <div class="section" id="lists-section">
            <h2>2. Wybierz listy i tryb nauki</h2>
            <div class="lists-container" id="lists-checkboxes">
                <!-- Dynamicznie generowane akordeony list -->
            </div>
            <div class="actions-row">
                <button onclick="startLearning('quiz')">Start: Quiz (4 opcje)</button>
                <button onclick="startLearning('typing')" style="background-color: #8b5cf6;">Start: Wpisywanie (po 1 literze)</button>
                <button onclick="exportJSON()" style="background-color: #059669;">Eksport / Kopiuj JSON</button>
            </div>
        </div>
    </div>

    <!-- SEKCJA NAUKI -->
    <div class="section hidden" id="quiz-section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
        <div class="stats">
            <span id="score-counter">Wynik: 0</span>
            <span id="progress-counter">Pytanie: 1/10</span>
        </div>

        <div class="quiz-card">
            <div style="font-size: 14px; color: var(--text-muted);">Przetłumacz na niemiecki:</div>
            <div class="word-display" id="question-word">pies</div>

            <!-- TRYB 1: Wybór opcji -->
            <div class="options-grid" id="options-container">
                <!-- Przyciski z odpowiedziami -->
            </div>

            <!-- TRYB 2: Wpisywanie z podpowiedzią po 1 literze -->
            <div id="typing-container" class="hidden">
                <div class="hint-display" id="hint-display"></div>
                <input type="text" id="typing-input" placeholder="Wpisz odpowiedź po niemiecku..." autocomplete="off">
                <div class="actions-row" style="justify-content: center; margin-top: 15px;">
                    <button onclick="checkTypingAnswer()" style="background-color: #10b981;">Sprawdź [Enter]</button>
                    <button onclick="giveLetterHint()" style="background-color: #f59e0b;">💡 Podpowiedź (+1 litera)</button>
                </div>
                <div style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">
                    * Zgłoszenia z normowaniami liter są akceptowane (np. <strong>u</strong> zamiast <strong>ü</strong>, <strong>a</strong> zamiast <strong>ä</strong>)
                </div>
            </div>

            <div class="feedback-message" id="feedback-message"></div>
        </div>

        <button onclick="endLearning()" style="background-color: #475569; margin-top: 20px;">Zakończ / Wróć</button>
    </div>

</div>

<script>
    let allData = [];
    let activeWords = [];
    let currentIndex = 0;
    let score = 0;
    let currentQuestion = null;
    let currentMode = 'quiz';
    let revealedLettersCount = 0;

    window.onload = function() {
        loadSampleData();
        loadLists();

        document.getElementById('typing-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkTypingAnswer();
            }
        });
    };

    function loadSampleData() {
        const sample = [
            {
                "list": "Podstawy",
                "words": [
                    {"pl": "pies", "de": "der Hund"},
                    {"pl": "kot", "de": "die Katze"},
                    {"pl": "dom", "de": "das Haus"},
                    {"pl": "auto", "de": "das Auto"},
                    {"pl": "książka", "de": "das Buch"}
                ]
            },
            {
                "list": "Jedzenie",
                "words": [
                    {"pl": "jabłko", "de": "der Apfel"},
                    {"pl": "chleb", "de": "das Brot"},
                    {"pl": "woda", "de": "das Wasser"},
                    {"pl": "ser", "de": "der Käse"},
                    {"pl": "mleko", "de": "die Milch"}
                ]
            }
        ];
        document.getElementById('json-input').value = JSON.stringify(sample, null, 2);
    }

    function syncTextareaWithData() {
        document.getElementById('json-input').value = JSON.stringify(allData, null, 2);
    }

    function addSingleWord() {
        const pl = document.getElementById('new-word-pl').
