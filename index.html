<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiszki i Quiz Słówkowy - Ciemny Motyw</title>
    <style>
        :root {
            --bg-color: #08111f;
            --bg-accent: #0f1d35;
            --card-bg: rgba(17, 24, 39, 0.82);
            --card-soft: rgba(148, 163, 184, 0.08);
            --primary: #7c3aed;
            --primary-strong: #6d28d9;
            --primary-soft: rgba(124, 58, 237, 0.18);
            --secondary: #38bdf8;
            --text: #e5eefb;
            --text-muted: #9fb3c8;
            --border: rgba(148, 163, 184, 0.2);
            --success: #22c55e;
            --error: #ef4444;
            --warning: #fbbf24;
            --input-bg: rgba(8, 17, 31, 0.8);
            --shadow: rgba(15, 23, 42, 0.45);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(124, 58, 237, 0.25), transparent 34%),
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.16), transparent 30%),
                linear-gradient(145deg, var(--bg-color) 0%, var(--bg-accent) 100%);
            color: var(--text);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 28px 16px 40px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px 24px 18px;
            box-shadow: 0 24px 60px var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        @media (min-width: 600px) {
            .container {
                padding: 34px 34px 18px;
            }
        }

        h1, h2 {
            margin-top: 0;
            letter-spacing: 0.02em;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            margin-bottom: 18px;
            background: linear-gradient(135deg, #c4b5fd, #7dd3fc, #f9a8d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        h2 {
            color: #d9e5ff;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            margin-bottom: 14px;
        }

        textarea, input[type="text"] {
            width: 100%;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            box-sizing: border-box;
            resize: vertical;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: rgba(124, 58, 237, 0.85);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.14);
        }

        textarea {
            min-height: 160px;
            font-family: 'Consolas', 'Courier New', monospace;
            line-height: 1.5;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.2s ease, filter 0.2s ease;
            box-shadow: 0 8px 18px rgba(124, 58, 237, 0.25);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        button:active {
            transform: translateY(0);
        }

        .section {
            margin-bottom: 26px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .section:last-of-type {
            border-bottom: none;
        }

        .info-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .actions-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .lists-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 18px 0;
        }

        .list-accordion {
            background: rgba(148, 163, 184, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
        }

        .list-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.015);
            cursor: pointer;
            user-select: none;
        }

        .list-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .list-content {
            display: none;
            padding: 0 16px 14px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.08);
        }

        .list-content.open {
            display: block;
        }

        .word-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(148, 163, 184, 0.18);
            font-size: 14px;
        }

        .word-row:last-child {
            border-bottom: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            padding: 6px 10px !important;
            font-size: 12px !important;
            margin-top: 0 !important;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.2) !important;
        }

        .quiz-card {
            background: linear-gradient(180deg, rgba(148, 163, 184, 0.05), rgba(255,255,255,0.02));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px 18px;
            margin-top: 16px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .quiz-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, rgba(124,58,237,0.12), transparent 40%);
            pointer-events: none;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .word-display {
            position: relative;
            z-index: 1;
            font-size: clamp(26px, 7vw, 38px);
            font-weight: 800;
            margin: 18px 0 14px;
            color: var(--text);
            word-break: break-word;
        }

        .hint-display {
            position: relative;
            z-index: 1;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: clamp(18px, 5vw, 28px);
            letter-spacing: 4px;
            color: var(--warning);
            margin: 18px 0;
            min-height: 42px;
            word-break: break-all;
            font-weight: 700;
        }

        .options-grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 18px;
        }

        @media (max-width: 560px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: rgba(15, 23, 42, 0.95);
            color: var(--text);
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 12px;
            padding: 14px 12px;
            min-height: 62px;
            font-size: clamp(13px, 3.4vw, 16px);
            line-height: 1.3;
            transition: all 0.2s ease;
            box-shadow: none;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-word;
        }

        .option-btn:hover {
            border-color: rgba(124, 58, 237, 0.9);
            background: rgba(124, 58, 237, 0.08);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, var(--success), #16a34a) !important;
            color: white;
            border-color: rgba(34, 197, 94, 0.8);
            box-shadow: 0 8px 18px rgba(34, 197, 94, 0.26);
        }

        .option-btn.incorrect {
            background: linear-gradient(135deg, var(--error), #dc2626) !important;
            color: white;
            border-color: rgba(239, 68, 68, 0.8);
            box-shadow: 0 8px 18px rgba(239, 68, 68, 0.25);
        }

        .feedback-message {
            position: relative;
            z-index: 1;
            margin-top: 16px;
            font-size: 16px;
            font-weight: 700;
            min-height: 24px;
        }

        .feedback-correct {
            color: var(--success);
        }

        .feedback-incorrect {
            color: var(--error);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="main-title">Fiszki i Quiz Słówkowy 🌙</h1>

    <!-- SEKCJA ZARZĄDZANIA -->
    <div id="management-container">
        <!-- KROK 1: Szybkie dodawanie + JSON -->
        <div class="section" id="import-section">
            <h2>1. Zarządzanie słówkami</h2>
            
            <div style="margin-bottom: 18px;">
                <p class="info-text" style="margin-bottom: 6px; font-weight: 700; color: var(--text);">Dodaj pojedyncze słówko:</p>
                <div class="form-row">
                    <input type="text" id="new-word-pl" placeholder="PL (np. pies)">
                    <input type="text" id="new-word-de" placeholder="DE (np. der Hund)">
                    <input type="text" id="new-word-list" placeholder="Nazwa listy (np. Zwierzęta)">
                </div>
                <button onclick="addSingleWord()" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 18px rgba(16,185,129,0.22);">Dodaj słówko</button>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 22px 0;">

            <p class="info-text" style="margin-bottom: 6px; font-weight: 700; color: var(--text);">Lub wklej cały JSON:</p>
            <textarea id="json-input" placeholder='[
  {
    "list": "Zwierzęta",
    "words": [
      {"pl": "ser", "de": "der Käse"},
      {"pl": "kot", "de": "die Katze"}
    ]
  }
]'></textarea>
            <div class="actions-row">
                <button onclick="loadLists()">Odśwież / Załaduj z JSON</button>
                <button onclick="loadSampleData()" style="background: linear-gradient(135deg, #475569, #334155); box-shadow: none;">Wklej przykład</button>
            </div>
        </div>

        <!-- KROK 2: Wybór list i trybu nauki -->
        <div class="section" id="lists-section">
            <h2>2. Wybierz listy i tryb nauki</h2>
            <div class="lists-container" id="lists-checkboxes">
                <!-- Dynamicznie generowane akordeony list -->
            </div>
            <div class="actions-row">
                <button onclick="startLearning('quiz')">Start: Quiz (4 opcje)</button>
                <button onclick="startLearning('typing')" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 8px 18px rgba(139, 92, 246, 0.2);">Start: Wpisywanie (po 1 literze)</button>
                <button onclick="exportJSON()" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 18px rgba(16,185,129,0.22);">Eksport / Kopiuj JSON</button>
            </div>
        </div>
    </div>

    <!-- SEKCJA NAUKI -->
    <div class="section hidden" id="quiz-section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
        <div class="stats">
            <span id="score-counter">Wynik: 0</span>
            <span id="progress-counter">Pytanie: 1/10</span>
        </div>

        <div class="quiz-card">
            <div style="font-size: 14px; color: var(--text-muted);">Przetłumacz na niemiecki:</div>
            <div class="word-display" id="question-word">pies</div>

            <!-- TRYB 1: Wybór opcji -->
            <div class="options-grid" id="options-container">
                <!-- Przyciski z odpowiedziami -->
            </div>

            <!-- TRYB 2: Wpisywanie z podpowiedzią po 1 literze -->
            <div id="typing-container" class="hidden">
                <div class="hint-display" id="hint-display"></div>
                <input type="text" id="typing-input" placeholder="Wpisz odpowiedź po niemiecku..." autocomplete="off">
                <div class="actions-row" style="justify-content: center; margin-top: 15px;">
                    <button onclick="checkTypingAnswer()" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 18px rgba(16,185,129,0.22);">Sprawdź [Enter]</button>
                    <button onclick="giveLetterHint()" style="background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 8px 18px rgba(245,158,11,0.22);">💡 Podpowiedź (+1 litera)</button>
                </div>
                <div style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">
                    * Zgłoszenia z normowaniami liter są akceptowane (np. <strong>u</strong> zamiast <strong>ü</strong>, <strong>a</strong> zamiast <strong>ä</strong>)
                </div>
            </div>

            <div class="feedback-message" id="feedback-message"></div>
        </div>

        <button onclick="endLearning()" style="background: linear-gradient(135deg, #475569, #334155); margin-top: 20px; box-shadow: none;">Zakończ / Wróć</button>
    </div>

</div>

<script>
    let allData = [];
    let activeWords = [];
    let currentIndex = 0;
    let score = 0;
    let currentQuestion = null;
    let currentMode = 'quiz';
    let revealedLettersCount = 0;

    window.onload = function() {
        document.getElementById('json-input').value = '';
        allData = [];
        loadLists();

        document.getElementById('typing-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkTypingAnswer();
            }
        });
    };

    function loadSampleData() {
        const sample = [
            {
                "list": "Podstawy",
                "words": [
                    {"pl": "pies", "de": "der Hund"},
                    {"pl": "kot", "de": "die Katze"},
                    {"pl": "dom", "de": "das Haus"},
                    {"pl": "auto", "de": "das Auto"},
                    {"pl": "książka", "de": "das Buch"}
                ]
            },
            {
                "list": "Jedzenie",
                "words": [
                    {"pl": "jabłko", "de": "der Apfel"},
                    {"pl": "chleb", "de": "das Brot"},
                    {"pl": "woda", "de": "das Wasser"},
                    {"pl": "ser", "de": "der Käse"},
                    {"pl": "mleko", "de": "die Milch"}
                ]
            }
        ];
        document.getElementById('json-input').value = JSON.stringify(sample, null, 2);
        loadLists();
    }

    function syncTextareaWithData() {
        document.getElementById('json-input').value = JSON.stringify(allData, null, 2);
    }

    function addSingleWord() {
        const pl = document.getElementById('new-word-pl').value.trim();
        const de = document.getElementById('new-word-de').value.trim();
        let listName = document.getElementById('new-word-list').value.trim();

        if (!pl || !de) {
            alert("Wypełnij pole polskie i niemieckie!");
            return;
        }

        if (!listName) listName = "Ogólne";

        try {
            const rawText = document.getElementById('json-input').value.trim();
            allData = rawText ? JSON.parse(rawText) : [];
        } catch (e) {
            allData = [];
        }

        if (!Array.isArray(allData)) {
            allData = [];
        }

        let targetList = allData.find(group => group && group.list && group.list.toLowerCase() === listName.toLowerCase());

        if (targetList) {
            targetList.words.push({"pl": pl, "de": de});
        } else {
            allData.push({
                "list": listName,
                "words": [{"pl": pl, "de": de}]
            });
        }

        syncTextareaWithData();
        loadLists();

        document.getElementById('new-word-pl').value = '';
        document.getElementById('new-word-de').value = '';
    }

    function loadLists() {
        try {
            const rawText = document.getElementById('json-input').value;
            const container = document.getElementById('lists-checkboxes');
            container.innerHTML = '';

            if (!rawText || !rawText.trim()) {
                container.innerHTML = `
                    <div style="padding: 18px; border: 1px dashed var(--border); border-radius: 12px; background: rgba(148,163,184,0.03); color: var(--text-muted); text-align: center;">
                        Brak danych. Dodaj słowa ręcznie albo wklej gotowy JSON.
                    </div>
                `;
                return;
            }

            allData = JSON.parse(rawText);

            if (!Array.isArray(allData)) {
                throw new Error("Główny element JSON musi być tablicą.");
            }

            if (allData.length === 0) {
                container.innerHTML = `
                    <div style="padding: 18px; border: 1px dashed var(--border); border-radius: 12px; background: rgba(148,163,184,0.03); color: var(--text-muted); text-align: center;">
                        Nie ma jeszcze żadnych list. Dodaj pierwsze słówko lub wklej JSON.
                    </div>
                `;
                return;
            }

            allData.forEach((group, index) => {
                const accordion = document.createElement('div');
                accordion.className = 'list-accordion';
                
                let wordsHTML = '';
                if (group.words && group.words.length > 0) {
                    group.words.forEach((word, wIndex) => {
                        wordsHTML += `
                            <div class="word-row">
                                <span><strong>${word.pl}</strong> — ${word.de}</span>
                                <button class="btn-danger" onclick="deleteWord(${index}, ${wIndex})">Usuń</button>
                            </div>
                        `;
                    });
                } else {
                    wordsHTML = `<div style="color: var(--text-muted); font-size: 13px; padding: 5px 0;">Brak słówek w tej liście.</div>`;
                }

                accordion.innerHTML = `
                    <div class="list-header">
                        <input type="checkbox" id="list-${index}" value="${index}" checked onclick="event.stopPropagation()">
                        <label for="list-${index}" style="cursor: pointer; flex-grow: 1;" onclick="event.stopPropagation()">
                            <strong>${group.list || `Lista ${index + 1}`}</strong> 
                            <span style="color: var(--text-muted); font-size: 13px;">(${(group.words || []).length} słówek)</span>
                        </label>
                        <button class="btn-danger" onclick="deleteList(${index}); event.stopPropagation();">Usuń listę</button>
                        <span style="font-size: 12px; color: var(--text-muted);">▼ rozwiń</span>
                    </div>
                    <div class="list-content" id="list-content-${index}">
                        ${wordsHTML}
                    </div>
                `;

                const header = accordion.querySelector('.list-header');
                const content = accordion.querySelector('.list-content');
                header.onclick = (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL' || e.target.tagName === 'BUTTON') return;
                    content.classList.toggle('open');
                };

                container.appendChild(accordion);
            });
        } catch (e) {
            alert("Błąd w formacie JSON: " + e.message);
        }
    }

    function deleteList(listIndex) {
        if (confirm(`Czy na pewno chcesz usunąć całą listę "${allData[listIndex].list}"?`)) {
            allData.splice(listIndex, 1);
            syncTextareaWithData();
            loadLists();
        }
    }

    function deleteWord(listIndex, wordIndex) {
        allData[listIndex].words.splice(wordIndex, 1);
        syncTextareaWithData();
        loadLists();
    }

    function exportJSON() {
        syncTextareaWithData();
        const text = document.getElementById('json-input').value;
        navigator.clipboard.writeText(text).then(() => {
            alert("Skopiowano JSON do schowka!");
        });
    }

    function startLearning(mode) {
        currentMode = mode;
        const checkboxes = document.querySelectorAll('#lists-checkboxes input[type="checkbox"]:checked');
        activeWords = [];

        checkboxes.forEach(cb => {
            const listIndex = parseInt(cb.value);
            if (allData[listIndex] && allData[listIndex].words) {
                activeWords.push(...allData[listIndex].words);
            }
        });

        if (activeWords.length === 0) {
            alert("Wybierz przynajmniej jedną listę zawierającą słówka!");
            return;
        }

        activeWords.sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;

        document.getElementById('management-container').classList.add('hidden');
        document.getElementById('main-title').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');

        if (currentMode === 'quiz') {
            document.getElementById('options-container').classList.remove('hidden');
            document.getElementById('typing-container').classList.add('hidden');
        } else {
            document.getElementById('options-container').classList.add('hidden');
            document.getElementById('typing-container').classList.remove('hidden');
        }

        nextQuestion();
    }

    function nextQuestion() {
        document.getElementById('feedback-message').innerText = '';
        document.getElementById('feedback-message').className = 'feedback-message';

        if (currentIndex >= activeWords.length) {
            alert(`Koniec nauki! Twój wynik: ${score} / ${activeWords.length}`);
            endLearning();
            return;
        }

        currentQuestion = activeWords[currentIndex];
        
        document.getElementById('score-counter').innerText = `Wynik: ${score}`;
        document.getElementById('progress-counter').innerText = `Pytanie: ${currentIndex + 1}/${activeWords.length}`;
        document.getElementById('question-word').innerText = currentQuestion.pl;

        if (currentMode === 'quiz') {
            setupQuizMode();
        } else {
            setupTypingMode();
        }
    }

    /* TRYB QUIZ */
    function setupQuizMode() {
        const correctAnswer = currentQuestion.de;
        let allPossibleAnswers = activeWords.map(w => w.de);
        allPossibleAnswers = [...new Set(allPossibleAnswers)];

        let distractors = allPossibleAnswers.filter(ans => ans !== correctAnswer);
        
        if (distractors.length < 3) {
            allData.forEach(g => g.words.forEach(w => {
                if (!distractors.includes(w.de) && w.de !== correctAnswer) {
                    distractors.push(w.de);
                }
            }));
        }

        distractors.sort(() => Math.random() - 0.5);
        let options = [correctAnswer, ...distractors.slice(0, 3)];
        options.sort(() => Math.random() - 0.5);

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkQuizAnswer(btn, opt, correctAnswer);
            optionsContainer.appendChild(btn);
            adjustFontSize(btn, opt);
        });
    }

    function adjustFontSize(button, text) {
        if (text.length > 20) {
            button.style.fontSize = '11px';
        } else if (text.length > 14) {
            button.style.fontSize = '13px';
        }
    }

    function checkQuizAnswer(button, selected, correct) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selected === correct) {
            button.classList.add('correct');
            score++;
        } else {
            button.classList.add('incorrect');
            allBtns.forEach(b => {
                if (b.innerText === correct) {
                    b.classList.add('correct');
                }
            });
        }

        currentIndex++;
        setTimeout(nextQuestion, 1200);
    }

    /* TRYB WPISYWANIA */
    function setupTypingMode() {
        revealedLettersCount = 0;
        const input = document.getElementById('typing-input');
        input.value = '';
        input.disabled = false;
        input.focus();

        updateHintDisplay();
    }

    function updateHintDisplay() {
        const answer = currentQuestion.de;
        let hint = '';
        let letterCounter = 0;

        for (let i = 0; i < answer.length; i++) {
            const char = answer[i];
            if (char === ' ') {
                hint += '   ';
            } else {
                letterCounter++;
                if (letterCounter <= revealedLettersCount) {
                    hint += char + ' ';
                } else {
                    hint += '_ ';
                }
            }
        }

        document.getElementById('hint-display').innerText = hint;
    }

    function giveLetterHint() {
        const totalLetters = currentQuestion.de.replace(/\s+/g, '').length;
        if (revealedLettersCount < totalLetters) {
            revealedLettersCount++;
            updateHintDisplay();
        }
        document.getElementById('typing-input').focus();
    }

    // Funkcja do usuwania znaków niemieckich / normalizacji tekstu
    function normalizeGermanText(str) {
        return str
            .toLowerCase()
            .replace(/ä/g, 'a')
            .replace(/ö/g, 'o')
            .replace(/ü/g, 'u')
            .replace(/ß/g, 'ss')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function checkTypingAnswer() {
        const input = document.getElementById('typing-input');
        if (input.disabled) return;

        const rawUserAnswer = input.value;
        const rawCorrectAnswer = currentQuestion.de;

        const normUser = normalizeGermanText(rawUserAnswer);
        const normCorrect = normalizeGermanText(rawCorrectAnswer);

        const feedback = document.getElementById('feedback-message');
        input.disabled = true;

        if (normUser === normCorrect) {
            feedback.innerText = "Świetnie! Poprawna odpowiedź!";
            feedback.className = "feedback-message feedback-correct";
            score++;
        } else {
            feedback.innerText = `Źle! Poprawna odpowiedź to: "${rawCorrectAnswer}"`;
            feedback.className = "feedback-message feedback-incorrect";
        }

        currentIndex++;
        setTimeout(nextQuestion, 1800);
    }

    function endLearning() {
        document.getElementById('quiz-section').classList.add('hidden');
        document.getElementById('management-container').classList.remove('hidden');
        document.getElementById('main-title').classList.remove('hidden');
        loadLists();
    }
</script>
